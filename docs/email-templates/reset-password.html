<!--
  Supabase "Reset Password" email template — paste into
  Dashboard → Authentication → Emails → Reset Password.
  Suggested subject: Your IsdaSafe password reset code

  Mirrors the app's forgot-password dialog: IsdaSafe teal (#0F7490) on a
  navy (#0B2644) header, a rounded card, and the code in large, spaced digits
  like the code field. The logo loads from {{ .SiteURL }}/icons/Icon-192.png,
  so Authentication → URL Configuration → Site URL must be the deployed web
  app. Email clients only support inline styles, hence the table layout.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { background-color: #0d1a22 !important; }
      .card { background-color: #14262f !important; }
      .text { color: #e6f1f5 !important; }
      .muted { color: #93a9b4 !important; }
      .code-box { background-color: #0d1a22 !important; border-color: #2a4452 !important; }
      .code { color: #3cc4bd !important; }
    }
  </style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#f4f8fb;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background-color:#f4f8fb;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="card" style="max-width:420px;background-color:#ffffff;border-radius:16px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color:#0B2644;padding:28px 24px;">
              <img src="{{ .SiteURL }}/icons/Icon-192.png" width="56" height="56" alt="IsdaSafe" style="display:block;border:0;border-radius:14px;margin:0 auto 12px;">
              <div style="font-family:Lexend,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:600;color:#ffffff;letter-spacing:0.3px;">IsdaSafe</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td align="center" style="padding:32px 28px 8px;font-family:'Source Sans 3','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <h1 class="text" style="margin:0 0 8px;font-family:Lexend,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:600;color:#0f2a3a;">Reset your password</h1>
              <p class="muted" style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#5b7280;">Enter this code in the app to continue.</p>

              <!-- Code -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                <tr>
                  <td align="center" class="code-box" style="background-color:#eef6f9;border:1px solid #cfe3ea;border-radius:12px;padding:16px 24px;">
                    <span class="code" style="font-family:Lexend,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:34px;font-weight:600;letter-spacing:8px;color:#0F7490;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <p class="muted" style="margin:24px 0 0;font-size:14px;line-height:1.5;color:#5b7280;">This code expires in 1 hour and can only be used once.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:20px 28px 32px;font-family:'Source Sans 3','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <p class="muted" style="margin:0;font-size:13px;line-height:1.5;color:#5b7280;">Didn't ask for this? You can safely ignore this email — your password won't change. Never share this code with anyone.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
